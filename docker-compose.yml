services:
  postgres:
    image: postgres:16-alpine
    container_name: revisao-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: revisao_db
    ports:
      - "5433:5432"
    volumes:
      - revisao_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d revisao_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  revisao_postgres_data:
    driver: local
